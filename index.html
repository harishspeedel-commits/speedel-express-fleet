<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SPEEDEL EXPRESS | Fleet Management System</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAq_iW6IYhbSLaa4xvrCN4ekWcbLwc_1k4",
            authDomain: "speedel-express-fleet.firebaseapp.com",
            projectId: "speedel-express-fleet",
            storageBucket: "speedel-express-fleet.firebasestorage.app",
            messagingSenderId: "441301047064",
            appId: "1:441301047064:web:f67d43000cf2be6450f06d",
            measurementId: "G-SRB8MY91VS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.query = query;
        window.where = where;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;

        console.log("🔥 Firebase connected!");
        window.firebaseReady = true;
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --primary: #e67e22; --primary-dark: #d35400; --secondary: #f39c12;
            --dark: #2c3e50; --light: #fff5eb; --gray: #7f8c8d;
            --success: #27ae60; --danger: #e74c3c; --warning: #f1c40f;
            --white: #ffffff; --shadow: 0 2px 10px rgba(0,0,0,0.08);
        }
        body.dark { --light: #1a1a2e; --white: #16213e; --dark: #e2e2e2; --gray: #a0a0a0; }
        body { background: var(--light); transition: all 0.3s ease; }
        .app { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            color: white;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar-header { padding: 30px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .logo-preview {
            width: 80px; height: 80px; margin: 0 auto 15px; background: var(--white);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: pointer; border: 2px solid var(--primary);
        }
        .logo-preview img, .logo-preview i { width: 100%; height: 100%; object-fit: cover; font-size: 40px; color: var(--primary); }
        .sidebar-header h2 { color: var(--secondary); font-size: 1.3rem; }
        .nav-links { flex: 1; padding: 20px 0; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 24px;
            color: white; font-size: 1rem; cursor: pointer; border: none;
            background: none; width: 100%; text-align: left;
        }
        .nav-link:hover, .nav-link.active { background: rgba(230, 126, 34, 0.3); padding-left: 30px; border-left: 3px solid var(--primary); }
        .nav-link i { width: 24px; }
        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .logout-btn { width: 100%; padding: 10px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
        .main-content { margin-left: 280px; flex: 1; padding: 30px; min-height: 100vh; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { color: var(--dark); font-size: 2rem; }
        .page-header p { color: var(--gray); margin-top: 5px; }
        .card { background: var(--white); border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow); }
        .card-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; border-left: 4px solid var(--primary); padding-left: 15px; color: var(--dark); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--dark); }
        input, select, textarea { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; background: var(--white); color: var(--dark); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.3s; }
        button:hover { background: var(--primary-dark); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--light); font-weight: 600; color: var(--dark); }
        td { color: var(--dark); }
        tr:hover { background: rgba(230, 126, 34, 0.05); }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-active { background: var(--success); color: white; }
        .status-maintenance { background: var(--danger); color: white; }
        .action-icons i { margin: 0 5px; cursor: pointer; font-size: 1.1rem; color: var(--primary); }
        .grid-2, .grid-3, .grid-4 { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar input { width: 200px; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .login-card h1 { color: var(--primary); margin-bottom: 10px; }
        .login-card input { margin: 10px 0; }
        .error-message { color: var(--danger); margin: 10px 0; }
        .toast-msg { position: fixed; bottom: 20px; right: 20px; background: var(--dark); color: white; padding: 12px 24px; border-radius: 30px; z-index: 1000; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        .theme-toggle { position: fixed; bottom: 20px; left: 20px; background: var(--primary); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; }
        .admin-badge { background: var(--primary); padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; margin-left: 8px; }
        .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 1.5rem; color: var(--primary); }
    </style>
</head>
<body>
<div id="appRoot"><div class="loading-screen">Loading SPEEDEL EXPRESS...</div></div>

<script>
    // Global state
    let currentUser = null;
    let userRole = null;
    let userData = null;
    let vehicles = [];
    let drivers = [];
    let contracts = [];
    let supervisors = [];
    let assignments = [];
    let globalNotice = '';
    let companyLogo = localStorage.getItem('companyLogo') || '';

    function notify(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function loadFirestoreData() {
        if (!window.db) return;
        try {
            const vehiclesSnap = await getDocs(collection(db, 'vehicles'));
            vehicles = vehiclesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            const driversSnap = await getDocs(collection(db, 'drivers'));
            drivers = driversSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            const contractsSnap = await getDocs(collection(db, 'contracts'));
            if (!contractsSnap.empty) contracts = contractsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            else {
                const defaultContracts = ['Expediter', 'AXP', 'Part-load', 'Others'];
                for (const name of defaultContracts) {
                    const docRef = await addDoc(collection(db, 'contracts'), { name });
                    contracts.push({ id: docRef.id, name });
                }
            }
            
            const assignmentsSnap = await getDocs(collection(db, 'assignments'));
            assignments = assignmentsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            const supervisorsSnap = await getDocs(collection(db, 'supervisors'));
            supervisors = supervisorsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            const noticeSnap = await getDoc(doc(db, 'settings', 'globalNotice'));
            if (noticeSnap.exists()) globalNotice = noticeSnap.data().value;
            
            renderAllPages();
        } catch(e) { console.error("Firestore error:", e); notify("Firebase connection issue. Check console."); }
    }

    async function saveToFirestore(collectionName, data) {
        if(window.db) {
            try {
                const docRef = await addDoc(collection(db, collectionName), data);
                return docRef.id;
            } catch(e) { console.error("Save error:", e); return null; }
        }
        return null;
    }

    async function updateInFirestore(collectionName, id, data) {
        if(window.db) {
            try {
                await updateDoc(doc(db, collectionName, id), data);
                return true;
            } catch(e) { console.error("Update error:", e); return false; }
        }
        return false;
    }

    async function deleteFromFirestore(collectionName, id) {
        if(window.db) {
            try {
                await deleteDoc(doc(db, collectionName, id));
                return true;
            } catch(e) { console.error("Delete error:", e); return false; }
        }
        return false;
    }

    function canEdit() { return currentUser && userRole === 'admin'; }
    function getAvailableVehicles() {
        if(userRole === 'admin') return vehicles;
        return vehicles.filter(v => v.status === 'Active');
    }

    // Fixed navigation - ALWAYS show Contracts and Supervisors for admin
    function buildNavigation() {
        const isAdmin = canEdit();
        let navHtml = `
            <button class="nav-link" data-page="dashboardPage" onclick="showPage('dashboardPage')"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
            <button class="nav-link" data-page="vehiclesPage" onclick="showPage('vehiclesPage')"><i class="fas fa-truck"></i> Vehicles</button>
            <button class="nav-link" data-page="driversPage" onclick="showPage('driversPage')"><i class="fas fa-id-card"></i> Drivers</button>
            <button class="nav-link" data-page="assignmentsPage" onclick="showPage('assignmentsPage')"><i class="fas fa-calendar-check"></i> Assignments</button>
            <button class="nav-link" data-page="maintenancePage" onclick="showPage('maintenancePage')"><i class="fas fa-wrench"></i> Maintenance</button>
        `;
        
        if (isAdmin) {
            navHtml += `
                <button class="nav-link" data-page="contractsPage" onclick="showPage('contractsPage')"><i class="fas fa-file-signature"></i> Contracts</button>
                <button class="nav-link" data-page="supervisorsPage" onclick="showPage('supervisorsPage')"><i class="fas fa-users-cog"></i> Supervisors</button>
            `;
        }
        
        navHtml += `<button class="nav-link" data-page="reportsPage" onclick="showPage('reportsPage')"><i class="fas fa-chart-line"></i> Reports</button>`;
        
        const navContainer = document.getElementById('navLinksContainer');
        if (navContainer) navContainer.innerHTML = navHtml;
    }

    function renderAllPages() {
        renderVehiclesPage();
        renderDriversPage();
        renderAssignmentsPage();
        renderMaintenancePage();
        renderContractsPage();
        renderSupervisorsPage();
        renderReportsPage();
        renderDashboardPage();
        renderLogo();
        buildNavigation(); // Rebuild navigation on every render
    }

    function renderLogo() {
        const logoContainer = document.getElementById('logoContainer');
        if(logoContainer) {
            if(companyLogo) {
                logoContainer.innerHTML = `<img src="${companyLogo}" alt="Logo" style="width:100%;height:100%;object-fit:cover">`;
            } else {
                logoContainer.innerHTML = '<i class="fas fa-truck"></i>';
            }
            if(canEdit()) {
                logoContainer.style.cursor = 'pointer';
                logoContainer.onclick = () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if(file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                companyLogo = ev.target.result;
                                localStorage.setItem('companyLogo', companyLogo);
                                renderLogo();
                                notify("Logo updated!");
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    input.click();
                };
            }
        }
    }

    function renderVehiclesPage() {
        const container = document.getElementById('vehiclesContent');
        if(!container) return;
        const canEditFlag = canEdit();
        container.innerHTML = `
            <div class="card">
                <div class="card-title"><i class="fas fa-plus-circle"></i> Add New Vehicle ${!canEditFlag ? '<span class="admin-badge">Admin Only</span>' : ''}</div>
                ${canEditFlag ? `
                <div class="grid-2">
                    <div class="form-group"><label>Registration Number</label><input type="text" id="newVehicleReg" placeholder="e.g., KA01AB9999"></div>
                    <div class="form-group"><label>Initial Status</label><select id="newVehicleStatus"><option value="Active">Active</option><option value="Maintenance">Maintenance</option></select></div>
                </div>
                <button onclick="addVehicle()"><i class="fas fa-save"></i> Add Vehicle</button>
                ` : '<p style="color:var(--danger);padding:10px;">Only Super Admin can add vehicles</p>'}
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-truck"></i> All Vehicles</div>
                <div class="table-container"><table><thead><tr><th>Reg Number</th><th>Status</th><th>Maintenance Remark</th>${canEditFlag ? '<th>Actions</th>' : ''}</tr></thead>
                <tbody>${vehicles.map(v => `<tr><td>${v.reg}</td><td><span class="status-badge ${v.status === 'Active' ? 'status-active' : 'status-maintenance'}">${v.status}</span></td><td>${v.maintenanceRemark || '-'}</td>${canEditFlag ? `<td class="action-icons"><i class="fas fa-edit" onclick="editVehicle('${v.id}')"></i><i class="fas fa-trash-alt" onclick="deleteVehicle('${v.id}')"></i></td>` : ''}</tr>`).join('')}</tbody></table></div>
            </div>
        `;
    }

    function renderDriversPage() {
        const container = document.getElementById('driversContent');
        if(!container) return;
        const canEditFlag = canEdit();
        container.innerHTML = `
            <div class="card">
                <div class="card-title"><i class="fas fa-user-plus"></i> Add New Driver ${!canEditFlag ? '<span class="admin-badge">Admin Only</span>' : ''}</div>
                ${canEditFlag ? `
                <div class="grid-2">
                    <div class="form-group"><label>Driver Name</label><input type="text" id="newDriverName" placeholder="Full name"></div>
                    <div class="form-group"><label>License Number</label><input type="text" id="newDriverLicense" placeholder="License No"></div>
                </div>
                <button onclick="addDriver()"><i class="fas fa-save"></i> Add Driver</button>
                ` : '<p style="color:var(--danger);padding:10px;">Only Super Admin can add drivers</p>'}
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-id-card"></i> All Drivers</div>
                <div class="table-container"><table><thead><tr><th>Name</th><th>License</th>${canEditFlag ? '<th>Actions</th>' : ''}</tr></thead>
                <tbody>${drivers.map(d => `<tr><td>${d.name}</td><td>${d.license}</td>${canEditFlag ? `<td class="action-icons"><i class="fas fa-edit" onclick="editDriver('${d.id}')"></i><i class="fas fa-trash-alt" onclick="deleteDriver('${d.id}')"></i></td>` : ''}</tr>`).join('')}</tbody></table></div>
            </div>
        `;
    }

    function renderAssignmentsPage() {
        const container = document.getElementById('assignmentsContent');
        if(!container) return;
        const today = new Date().toISOString().split('T')[0];
        const availableVehicles = getAvailableVehicles();
        container.innerHTML = `
            <div class="card">
                <div class="card-title"><i class="fas fa-calendar-check"></i> New Assignment</div>
                <div class="grid-4">
                    <div class="form-group"><label>Select Driver</label><select id="assignDriverId">${drivers.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}</select></div>
                    <div class="form-group"><label>Select Vehicle</label><select id="assignVehicleId">${availableVehicles.map(v => `<option value="${v.id}">${v.reg}</option>`).join('')}</select></div>
                    <div class="form-group"><label>Date</label><input type="date" id="assignDate" value="${today}"></div>
                    <div class="form-group"><label>Contract</label><select id="assignContractId">${contracts.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                </div>
                <div class="form-group"><label>Remarks</label><input type="text" id="assignRemarks" placeholder="Optional notes"></div>
                <button onclick="createAssignment()"><i class="fas fa-link"></i> Create Assignment</button>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-list"></i> Assignment Records</div>
                <div class="table-container"><table><thead><tr><th>Date</th><th>Driver</th><th>Vehicle</th><th>Contract</th><th>Remarks</th><th>Actions</th></tr></thead>
                <tbody>${assignments.map(a => {
                    const driver = drivers.find(d=>d.id===a.driverId);
                    const vehicle = vehicles.find(v=>v.id===a.vehicleId);
                    const contract = contracts.find(c=>c.id===a.contractId);
                    return `<tr><td>${a.date}</td><td>${driver?.name || '?'}</td><td>${vehicle?.reg || '?'}</td><td>${contract?.name || '?'}</td><td>${a.remarks || '-'}</td><td class="action-icons"><i class="fas fa-trash-alt" onclick="deleteAssignment('${a.id}')"></i></td></tr>`;
                }).join('')}</tbody></table></div>
            </div>
        `;
    }

    function renderMaintenancePage() {
        const container = document.getElementById('maintenanceContent');
        if(!container) return;
        container.innerHTML = `
            <div class="card">
                <div class="card-title"><i class="fas fa-wrench"></i> Update Maintenance Status</div>
                <div class="grid-2">
                    <div class="form-group"><label>Select Vehicle</label><select id="maintenanceVehicleId">${vehicles.map(v => `<option value="${v.id}">${v.reg} (${v.status})</option>`).join('')}</select></div>
                    <div class="form-group"><label>Maintenance Remark</label><textarea id="maintenanceRemark" rows="2" placeholder="Describe issue or repair"></textarea></div>
                </div>
                <button onclick="setMaintenance()" style="background:var(--danger)"><i class="fas fa-tools"></i> Mark as Maintenance</button>
                <button onclick="markReady()" style="background:var(--success); margin-left:10px"><i class="fas fa-check-circle"></i> Mark as Ready</button>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-clipboard-list"></i> Fleet Status</div>
                <div class="table-container"><table><thead><tr><th>Vehicle</th><th>Status</th><th>Maintenance History</th><th>Quick Action</th></tr></thead>
                <tbody>${vehicles.map(v => `<tr><td>${v.reg}</td><td><span class="status-badge ${v.status==='Active'?'status-active':'status-maintenance'}">${v.status}</span></td><td>${v.maintenanceRemark || '-'}</td><td>${v.status === 'Maintenance' ? `<button onclick="markReadyById('${v.id}')" style="padding:5px 10px;font-size:0.8rem">✅ Ready</button>` : `<button onclick="setMaintenanceById('${v.id}')" style="padding:5px 10px;font-size:0.8rem">🔧 Mark Maintenance</button>`}</td></tr>`).join('')}</tbody></table></div>
            </div>
        `;
    }

    function renderContractsPage() {
        const container = document.getElementById('contractsContent');
        if(!container) return;
        if(!canEdit()) { container.innerHTML = '<div class="card"><p style="color:var(--danger)">Only Super Admin can manage contracts</p></div>'; return; }
        container.innerHTML = `
            <div class="card"><div class="card-title"><i class="fas fa-file-signature"></i> Manage Contracts</div>
            <div class="grid-2"><div class="form-group"><label>New Contract Name</label><input type="text" id="newContractName" placeholder="Enter contract name"></div><button onclick="addContract()">Add Contract</button></div></div>
            <div class="card"><div class="card-title">Existing Contracts</div>
            <div class="table-container"><table><thead><tr><th>Contract Name</th><th>Actions</th></tr></thead>
            <tbody>${contracts.map(c => `<tr><td>${c.name}</td><td class="action-icons"><i class="fas fa-trash-alt" onclick="deleteContract('${c.id}')"></i></td></tr>`).join('')}</tbody></table></div></div>
        `;
    }

    function renderSupervisorsPage() {
        const container = document.getElementById('supervisorsContent');
        if(!container) return;
        if(!canEdit()) { container.innerHTML = '<div class="card"><p style="color:var(--danger)">Only Super Admin can manage supervisors</p></div>'; return; }
        container.innerHTML = `
            <div class="card">
                <div class="card-title"><i class="fas fa-users-cog"></i> Create New Supervisor</div>
                <div class="grid-2">
                    <div class="form-group"><label>Email (Login ID)</label><input type="email" id="supEmail" placeholder="supervisor@example.com"></div>
                    <div class="form-group"><label>Full Name</label><input type="text" id="supName" placeholder="Full name"></div>
                    <div class="form-group"><label>Assign Contract</label><select id="supContractId">${contracts.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                </div>
                <button onclick="createSupervisor()"><i class="fas fa-user-plus"></i> Create Supervisor (Password auto-generated)</button>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-users"></i> All Supervisors</div>
                <div class="table-container"><table><thead><tr><th>Name</th><th>Email</th><th>Contract</th><th>Actions</th></tr></thead>
                <tbody>${supervisors.map(s => `<tr><td>${s.name}</td><td>${s.email}</td><td>${contracts.find(c=>c.id===s.contractId)?.name || '-'}</td><td class="action-icons"><i class="fas fa-trash-alt" onclick="deleteSupervisor('${s.id}')"></i></td></tr>`).join('')}</tbody></table></div>
            </div>
        `;
    }

    function renderReportsPage() {
        const container = document.getElementById('reportsContent');
        if(!container) return;
        container.innerHTML = `
            <div class="card"><div class="card-title"><i class="fas fa-filter"></i> Filter Reports</div>
            <div class="filter-bar"><input type="text" id="filterVehicle" placeholder="Filter by Vehicle Reg" onkeyup="filterReports()"><input type="text" id="filterDriver" placeholder="Filter by Driver Name" onkeyup="filterReports()"></div>
            <div id="reportTable"></div></div>
            <div class="card"><div class="card-title"><i class="fas fa-chart-line"></i> Export Reports</div>
            <div style="display:flex; gap:15px; flex-wrap:wrap;"><button onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export to Excel</button><button onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> Export to PDF</button></div></div>
            <div class="card"><div class="card-title"><i class="fas fa-bullhorn"></i> Global Notice</div>
            <textarea id="globalNoticeEditor" rows="3" style="width:100%">${globalNotice}</textarea><button onclick="updateGlobalNotice()" style="margin-top:10px">Update Notice</button></div>
        `;
        filterReports();
    }

    function filterReports() {
        const vehicleFilter = document.getElementById('filterVehicle')?.value.toLowerCase() || '';
        const driverFilter = document.getElementById('filterDriver')?.value.toLowerCase() || '';
        const filtered = assignments.filter(a => {
            const vehicle = vehicles.find(v=>v.id===a.vehicleId);
            const driver = drivers.find(d=>d.id===a.driverId);
            return (vehicle?.reg.toLowerCase().includes(vehicleFilter)) && (driver?.name.toLowerCase().includes(driverFilter));
        });
        const reportDiv = document.getElementById('reportTable');
        if(reportDiv) {
            reportDiv.innerHTML = `<div class="table-container"><table><thead><tr><th>Date</th><th>Driver</th><th>Vehicle</th><th>Contract</th><th>Remarks</th></tr></thead>
            <tbody>${filtered.map(a => {
                const driver = drivers.find(d=>d.id===a.driverId);
                const vehicle = vehicles.find(v=>v.id===a.vehicleId);
                const contract = contracts.find(c=>c.id===a.contractId);
                return `<tr><td>${a.date}</td><td>${driver?.name}</td><td>${vehicle?.reg}</td><td>${contract?.name}</td><td>${a.remarks}</td></tr>`;
            }).join('')}</tbody></table></div>`;
        }
    }

    function renderDashboardPage() {
        const container = document.getElementById('dashboardContent');
        if(!container) return;
        container.innerHTML = `
            <div class="page-header"><h1>Dashboard</h1><p>Welcome ${currentUser?.email || 'User'} ${canEdit() ? '(Super Admin)' : '(Supervisor)'}</p></div>
            ${globalNotice ? `<div class="card" style="background:var(--warning);color:var(--dark)"><i class="fas fa-bullhorn"></i> ${globalNotice}</div>` : ''}
            <div class="grid-3">
                <div class="card"><h3><i class="fas fa-truck"></i> Vehicles</h3><p style="font-size:2rem;font-weight:bold">${vehicles.length}</p><p>Active: ${vehicles.filter(v=>v.status==='Active').length} | Maintenance: ${vehicles.filter(v=>v.status==='Maintenance').length}</p></div>
                <div class="card"><h3><i class="fas fa-id-card"></i> Drivers</h3><p style="font-size:2rem;font-weight:bold">${drivers.length}</p></div>
                <div class="card"><h3><i class="fas fa-calendar-check"></i> Today's Assignments</h3><p style="font-size:2rem;font-weight:bold">${assignments.filter(a=>a.date === new Date().toISOString().split('T')[0]).length}</p></div>
            </div>
        `;
    }

    // CRUD Operations
    window.addVehicle = async () => { if(!canEdit()) return; const reg = document.getElementById('newVehicleReg')?.value; if(!reg) return; const newVehicle = { reg, status: document.getElementById('newVehicleStatus')?.value, maintenanceRemark: '' }; const id = await saveToFirestore('vehicles', newVehicle); if(id) { vehicles.push({ id, ...newVehicle }); renderAllPages(); notify("Vehicle added"); } };
    window.editVehicle = async (id) => { if(!canEdit()) return; const newReg = prompt("New Registration Number:"); if(newReg) { await updateInFirestore('vehicles', id, { reg: newReg }); const v = vehicles.find(v=>v.id===id); if(v) v.reg = newReg; renderAllPages(); notify("Updated"); } };
    window.deleteVehicle = async (id) => { if(!canEdit()) return; await deleteFromFirestore('vehicles', id); vehicles = vehicles.filter(v=>v.id !== id); renderAllPages(); notify("Deleted"); };
    window.addDriver = async () => { if(!canEdit()) return; const name = document.getElementById('newDriverName')?.value; if(!name) return; const newDriver = { name, license: document.getElementById('newDriverLicense')?.value }; const id = await saveToFirestore('drivers', newDriver); if(id) { drivers.push({ id, ...newDriver }); renderAllPages(); notify("Driver added"); } };
    window.editDriver = async (id) => { if(!canEdit()) return; const newName = prompt("New Driver Name:"); if(newName) { await updateInFirestore('drivers', id, { name: newName }); const d = drivers.find(d=>d.id===id); if(d) d.name = newName; renderAllPages(); notify("Updated"); } };
    window.deleteDriver = async (id) => { if(!canEdit()) return; await deleteFromFirestore('drivers', id); drivers = drivers.filter(d=>d.id !== id); renderAllPages(); notify("Deleted"); };
    window.createAssignment = async () => { const driverId = document.getElementById('assignDriverId')?.value; const vehicleId = document.getElementById('assignVehicleId')?.value; if(!driverId || !vehicleId) return; const newAssign = { date: document.getElementById('assignDate')?.value, driverId, vehicleId, contractId: document.getElementById('assignContractId')?.value, remarks: document.getElementById('assignRemarks')?.value }; const id = await saveToFirestore('assignments', newAssign); if(id) { assignments.push({ id, ...newAssign }); renderAllPages(); notify("Assigned"); } };
    window.deleteAssignment = async (id) => { await deleteFromFirestore('assignments', id); assignments = assignments.filter(a=>a.id !== id); renderAllPages(); notify("Deleted"); };
    window.setMaintenance = async () => { const vehicleId = document.getElementById('maintenanceVehicleId')?.value; const remark = document.getElementById('maintenanceRemark')?.value; const vehicle = vehicles.find(v=>v.id === vehicleId); if(vehicle) { await updateInFirestore('vehicles', vehicleId, { status: 'Maintenance', maintenanceRemark: remark }); vehicle.status = 'Maintenance'; vehicle.maintenanceRemark = remark; renderAllPages(); notify("In Maintenance"); } };
    window.markReady = async () => { const vehicleId = document.getElementById('maintenanceVehicleId')?.value; const vehicle = vehicles.find(v=>v.id === vehicleId); if(vehicle) { await updateInFirestore('vehicles', vehicleId, { status: 'Active', maintenanceRemark: vehicle.maintenanceRemark + " | Repaired" }); vehicle.status = 'Active'; vehicle.maintenanceRemark += " | Repaired"; renderAllPages(); notify("Ready"); } };
    window.markReadyById = async (id) => { const vehicle = vehicles.find(v=>v.id === id); if(vehicle) { await updateInFirestore('vehicles', id, { status: 'Active', maintenanceRemark: vehicle.maintenanceRemark + " | Ready" }); vehicle.status = 'Active'; vehicle.maintenanceRemark += " | Ready"; renderAllPages(); notify(`${vehicle.reg} ready`); } };
    window.setMaintenanceById = async (id) => { const remark = prompt("Maintenance remark:"); const vehicle = vehicles.find(v=>v.id === id); if(vehicle && remark) { await updateInFirestore('vehicles', id, { status: 'Maintenance', maintenanceRemark: remark }); vehicle.status = 'Maintenance'; vehicle.maintenanceRemark = remark; renderAllPages(); notify("In Maintenance"); } };
    window.addContract = async () => { if(!canEdit()) return; const name = document.getElementById('newContractName')?.value; if(name) { const id = await saveToFirestore('contracts', { name }); if(id) { contracts.push({ id, name }); renderAllPages(); notify("Contract added"); } } };
    window.deleteContract = async (id) => { if(!canEdit()) return; await deleteFromFirestore('contracts', id); contracts = contracts.filter(c=>c.id !== id); renderAllPages(); };
    window.createSupervisor = async () => { if(!canEdit()) return; const email = document.getElementById('supEmail')?.value; const name = document.getElementById('supName')?.value; if(email && name) { const tempPassword = Math.random().toString(36).slice(-8); try { const userCred = await createUserWithEmailAndPassword(auth, email, tempPassword); const supData = { email, name, password: tempPassword, contractId: document.getElementById('supContractId')?.value, uid: userCred.user.uid }; const id = await saveToFirestore('supervisors', supData); if(id) { supervisors.push({ id, ...supData }); renderAllPages(); notify(`✅ Supervisor ${name} created! Password: ${tempPassword}`); } } catch(e) { notify("Error: " + e.message); } } else notify("Fill all fields"); };
    window.deleteSupervisor = async (id) => { if(!canEdit()) return; const sup = supervisors.find(s=>s.id===id); if(sup && sup.uid) { try { await deleteFromFirestore('supervisors', id); supervisors = supervisors.filter(s=>s.id !== id); renderAllPages(); notify("Deleted"); } catch(e) { notify("Error deleting"); } } };
    window.updateGlobalNotice = async () => { globalNotice = document.getElementById('globalNoticeEditor')?.value || ''; if(window.db) await setDoc(doc(db, 'settings', 'globalNotice'), { value: globalNotice }); renderAllPages(); notify("Notice updated"); };
    window.exportToExcel = () => { const wsData = assignments.map(a => ({ Date: a.date, Driver: drivers.find(d=>d.id===a.driverId)?.name, Vehicle: vehicles.find(v=>v.id===a.vehicleId)?.reg, Remarks: a.remarks })); const ws = XLSX.utils.json_to_sheet(wsData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Assignments"); XLSX.writeFile(wb, `SPEEDEL_${new Date().toISOString().slice(0,10)}.xlsx`); notify("Exported"); };
    window.exportToPDF = () => { const element = document.querySelector('#reportTable'); if(element) html2pdf().from(element).set({ margin:0.5, filename:`SPEEDEL_Report.pdf` }).save(); };
    window.filterReports = filterReports;
    window.toggleTheme = () => { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); };
    window.showPage = (pageId) => { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pageId)?.classList.add('active'); document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active')); Array.from(document.querySelectorAll('.nav-link')).find(l => l.getAttribute('data-page') === pageId)?.classList.add('active'); };

    // Auth
    async function handleLogin(email, password) {
        try {
            const userCred = await signInWithEmailAndPassword(auth, email, password);
            const user = userCred.user;
            if(email === 'harishspeedel@gmail.com') {
                currentUser = user;
                userRole = 'admin';
                userData = { displayName: 'Harish Admin' };
            } else {
                const q = query(collection(db, 'supervisors'), where('email', '==', email));
                const snapshot = await getDocs(q);
                if(!snapshot.empty) {
                    currentUser = user;
                    userRole = 'supervisor';
                    userData = snapshot.docs[0].data();
                } else { await signOut(auth); return false; }
            }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('currentUserName').innerText = userData?.displayName || email.split('@')[0];
            await loadFirestoreData();
            return true;
        } catch(e) { return false; }
    }

    function handleLogout() { signOut(auth); currentUser = null; userRole = null; document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('appContainer').style.display = 'none'; }

    async function setupFirstAdmin() {
        try {
            await createUserWithEmailAndPassword(auth, 'harishspeedel@gmail.com', 'SPDL@8055');
            console.log("Admin account created");
        } catch(e) { if(e.code !== 'auth/email-already-in-use') console.log("Admin setup:", e.message); }
    }

    function initApp() {
        const savedTheme = localStorage.getItem('theme');
        if(savedTheme === 'dark') document.body.classList.add('dark');
        const loginHtml = `<div class="login-container" id="loginScreen"><div class="login-card"><h1>⚡ SPEEDEL EXPRESS</h1><p>Fleet Management System</p><input type="email" id="loginEmail" placeholder="Email"><input type="password" id="loginPassword" placeholder="Password"><div id="loginError" class="error-message"></div><button id="loginBtn">Login</button></div></div>`;
        const appHtml = `<div id="appContainer" style="display:none"><div class="sidebar"><div class="sidebar-header"><div class="logo-preview" id="logoContainer"></div><h2>SPEEDEL EXPRESS</h2></div><div class="nav-links" id="navLinksContainer"></div><div class="sidebar-footer"><div class="user-info"><i class="fas fa-user-circle"></i><span id="currentUserName"></span></div><button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div><div class="main-content"><div id="dashboardPage" class="page"><div id="dashboardContent"></div></div><div id="vehiclesPage" class="page"><div id="vehiclesContent"></div></div><div id="driversPage" class="page"><div id="driversContent"></div></div><div id="assignmentsPage" class="page"><div id="assignmentsContent"></div></div><div id="maintenancePage" class="page"><div id="maintenanceContent"></div></div><div id="contractsPage" class="page"><div id="contractsContent"></div></div><div id="supervisorsPage" class="page"><div id="supervisorsContent"></div></div><div id="reportsPage" class="page"><div id="reportsContent"></div></div></div><div class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></div></div>`;
        document.getElementById('appRoot').innerHTML = loginHtml + appHtml;
        document.getElementById('loginBtn').onclick = async () => { const email = document.getElementById('loginEmail').value; const pwd = document.getElementById('loginPassword').value; if(await handleLogin(email, pwd)) { showPage('dashboardPage'); } else document.getElementById('loginError').innerText = 'Invalid credentials'; };
        showPage('dashboardPage');
        setTimeout(setupFirstAdmin, 2000);
    }
    initApp();
</script>
</body>
