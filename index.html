    <style>

        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        .action-btn:hover { transform: scale(1.05); }

        .status-timeline { display: flex; gap: 5px; align-items: center; font-size: 0.65rem; flex-wrap: wrap; }
        .status-timeline .step { padding: 2px 8px; border-radius: 12px; background: var(--gray); color: white; font-size: 0.6rem; }
        .status-timeline .step.active { background: var(--primary); }
        .status-timeline .step.done { background: var(--success); }
        .status-timeline .arrow { color: var(--gray); font-size: 0.6rem; }
        .mechanic-assigned { background: rgba(52, 152, 219, 0.1); border-left: 3px solid var(--info); }
        .btn-export-excel { background: #28a745; }
        .btn-export-excel:hover { background: #218838; }
        .btn-export-pdf { background: #dc3545; }
        .btn-export-pdf:hover { background: #c82333; }
        .btn-export { padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; color: white; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-export:hover { transform: scale(1.05); }
        .btn-export i { margin-right: 5px; }
        .export-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .btn-filter { background: var(--info); }
        .btn-filter:hover { background: #2980b9; }
        .btn-clear { background: var(--gray); }
        .btn-clear:hover { background: #6c7a7d; }
        .btn-success-custom { background: var(--success); }
        .btn-success-custom:hover { background: #219a52; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.6rem; font-weight: 700; }
        .badge-warning { background: var(--warning); color: #333; }
        .badge-danger { background: var(--danger); color: white; }
        .badge-success { background: var(--success); color: white; }
        .badge-info { background: var(--info); color: white; }
        .document-preview { max-width: 60px; max-height: 60px; cursor: pointer; border-radius: 8px; object-fit: cover; border: 1px solid #ddd; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
        .loading-overlay .spinner { width: 60px; height: 60px; border: 6px solid var(--light); border-top: 6px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-overlay .logo-text { color: var(--secondary); font-size: 2rem; font-weight: 700; margin-bottom: 10px; }
        .loading-overlay p { color: white; margin-top: 15px; font-size: 1.1rem; }
        .loading-overlay .sub-text { color: #aaa; font-size: 0.9rem; margin-top: 5px; }
        .loading-overlay .error-text { color: var(--danger); font-size: 1.2rem; margin-top: 10px; }
        .report-filters { background: var(--light); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .report-filters .filter-row { margin-bottom: 0; }

<body>
<div id="appRoot"></div>

<script>
    // ============================================================
    //  LOADING OVERLAY
    // ============================================================
    function showLoading(message) {
        let overlay = document.getElementById('loadingOverlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'loading-overlay';
            overlay.id = 'loadingOverlay';
            document.body.appendChild(overlay);
        }
        overlay.innerHTML = `
            <div class="logo-text">⚡ SPEEDEL EXPRESS</div>
            <div class="spinner"></div>
            <p>${message || 'Loading...'}</p>
            <div class="sub-text">Fleet Management System</div>
        `;
        overlay.style.display = 'flex';
    }

    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.style.display = 'none';
        }
    }

    function showLoadingError(message) {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.innerHTML = `
                <div class="logo-text">⚡ SPEEDEL EXPRESS</div>
                <div style="color:var(--danger);font-size:3rem;margin-bottom:15px;">❌</div>
                <p style="color:white;font-size:1.1rem;">${message || 'Failed to load'}</p>
                <div class="sub-text">Please check your internet connection</div>
                <button onclick="location.reload()" style="margin-top:20px;padding:12px 30px;background:var(--primary);border:none;border-radius:8px;color:white;font-size:1rem;cursor:pointer;">Retry</button>
            `;
        }
    }

    // ============================================================
    //  FIREBASE CONFIG & INITIALIZATION
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyAq_iW6IYhbSLaa4xvrCN4ekWcbLwc_1k4",
        authDomain: "speedel-express-fleet.firebaseapp.com",
        databaseURL: "https://speedel-express-fleet-default-rtdb.firebaseio.com",
        projectId: "speedel-express-fleet",
        storageBucket: "speedel-express-fleet.firebasestorage.app",
        messagingSenderId: "441301047064",
        appId: "1:441301047064:web:f67d43000cf2be6450f06d",
        measurementId: "G-SRB8MY91VS"
    };

    let auth = null, db = null, firebaseReady = false;

    function initFirebase() {
        try {
            if (typeof firebase === 'undefined') {
                showLoadingError("Firebase SDK not loaded!");
                return false;
            }
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                console.log("✅ Firebase app initialized");
            }
            auth = firebase.auth();
            db = firebase.firestore();
            
            db.enablePersistence()
                .then(() => console.log("✅ Firestore persistence enabled"))
                .catch((err) => console.warn("⚠️ Persistence warning:", err));

            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                .then(() => console.log("✅ Auth persistence set to local"))
                .catch((error) => console.error("❌ Auth persistence error:", error));

            window.auth = auth;
            window.db = db;
            window.firebaseReady = true;
            firebaseReady = true;

            console.log("🔥 Firebase Connected Successfully!");
            document.dispatchEvent(new CustomEvent('firebaseReady'));
            hideLoading();
            return true;
        } catch (error) {
            console.error("❌ Firebase initialization error:", error);
            showLoadingError("Failed to connect to Firebase: " + error.message);
            return false;
        }
    }

    // ============================================================
    //  GLOBALS
    // ============================================================
    let currentUser = null, userRole = null, userData = null, userPermissions = [];
    let vehicles = [], drivers = [], contracts = [], supervisors = [], mechanics = [];
    let assignments = [], fuelRecords = [], expenses = [], documents = [];
    let maintenance = [], trips = [], attendance = [], payroll = [], incentives = [];
    let auditLogs = [], leaves = [], advances = [], transfers = [], breakdowns = [];
    let companyLogo = localStorage.getItem('companyLogo') || '';
    let isDataLoaded = false, reportData = {};

    const INCENTIVE_CONFIG = {
        baseTrips: 6,
        bonusPerTrip: 500,
        sundayExtraSalary: true,
        slabs: [
            { min: 0, max: 6, rate: 0 },
            { min: 7, max: 10, rate: 500 },
            { min: 11, max: 15, rate: 750 },
            { min: 16, max: 999, rate: 1000 }
        ]
    };

    const MODULES = {
        dashboard: { label: 'Dashboard', icon: 'fa-tachometer-alt' },
        vehicles: { label: 'Vehicles', icon: 'fa-truck' },
        drivers: { label: 'Drivers', icon: 'fa-id-card' },
        assignments: { label: 'Trips', icon: 'fa-calendar-check' },
        maintenance: { label: 'Maintenance', icon: 'fa-wrench' },
        fuel: { label: 'Fuel', icon: 'fa-gas-pump' },
        expenses: { label: 'Expenses', icon: 'fa-money-bill-wave' },
        insurance: { label: 'Insurance', icon: 'fa-file-contract' },
        documents: { label: 'Documents', icon: 'fa-folder-open' },
        contracts: { label: 'Contracts', icon: 'fa-file-signature' },
        supervisors: { label: 'Supervisors', icon: 'fa-users-cog' },
        mechanics: { label: 'Mechanics', icon: 'fa-tools' },
        reports: { label: 'Reports', icon: 'fa-chart-line' },
        attendance: { label: 'Attendance', icon: 'fa-clock' },
        payroll: { label: 'Payroll', icon: 'fa-wallet' },
        incentives: { label: 'Incentives', icon: 'fa-star' },
        audit: { label: 'Audit Logs', icon: 'fa-history' },
        leaves: { label: 'Leaves', icon: 'fa-calendar-alt' },
        advances: { label: 'Advance Salary', icon: 'fa-hand-holding-usd' },
        transfers: { label: 'Transfers', icon: 'fa-exchange-alt' },
        breakdowns: { label: 'Breakdowns', icon: 'fa-car-crash' }
    };

    function notify(msg) { 
        const toast = document.createElement('div'); 
        toast.className = 'toast-msg'; 
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`; 
        document.body.appendChild(toast); 
        setTimeout(() => toast.remove(), 4000); 
    }

    function toggleSidebar() { 
        document.getElementById('sidebar')?.classList.toggle('open');
        document.getElementById('sidebarOverlay')?.classList.toggle('active');
    }

    function closeSidebar() { 
        document.getElementById('sidebar')?.classList.remove('open');
        document.getElementById('sidebarOverlay')?.classList.remove('active');
    }

    function hasPermission(module) { 
        return userPermissions.includes(module) || userRole === 'superadmin' || userRole === 'admin'; 
    }

    function canEdit() { return userRole === 'superadmin' || userRole === 'admin'; }

    function isMechanic() { return userRole === 'mechanic'; }

    function getAvailableVehicles() { return vehicles.filter(v => v.status === 'Active'); }

    // ============================================================
    //  INCENTIVE CALCULATION ENGINE
    // ============================================================
    function calculateSlabIncentive(trips) {
        for (const slab of INCENTIVE_CONFIG.slabs) {
            if (trips >= slab.min && trips <= slab.max) {
                return trips * slab.rate;
            }
        }
        return 0;
    }

    function calculateDriverIncentives(driverId, month, year) {
        const driverTrips = assignments.filter(a => {
            if (a.driverId !== driverId) return false;
            if (!a.date) return false;
            const d = new Date(a.date);
            return d.getMonth() === month && d.getFullYear() === year && a.status === 'Closed';
        });

        const weeks = {};
        driverTrips.forEach(trip => {
            const date = new Date(trip.date);
            const dayOfWeek = date.getDay();
            const monday = new Date(date);
            monday.setDate(date.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            const weekKey = monday.toISOString().split('T')[0];
            if (!weeks[weekKey]) weeks[weekKey] = { trips: [], sundayTrips: [] };
            if (dayOfWeek === 0) weeks[weekKey].sundayTrips.push(trip);
            else weeks[weekKey].trips.push(trip);
        });

        let totalIncentive = 0, sundayCount = 0, weeklyBreakdown = [];
        Object.keys(weeks).forEach(weekKey => {
            const week = weeks[weekKey];
            const monToSatTrips = week.trips.length;
            const sundayTrips = week.sundayTrips.length;
            const weekIncentive = calculateSlabIncentive(monToSatTrips);
            if (sundayTrips > 0) sundayCount += sundayTrips;
            totalIncentive += weekIncentive;
            weeklyBreakdown.push({ week: weekKey, monToSatTrips, sundayTrips, incentive: weekIncentive });
        });

        return { totalIncentive, sundayCount, weeklyBreakdown, totalTrips: driverTrips.length };
    }

    function getDaysInMonth(month, year) { return new Date(year, month + 1, 0).getDate(); }

    function calculateSalary(driverId, month, year, basicSalary) {
        const daysInMonth = getDaysInMonth(month, year);
        const perDaySalary = basicSalary / daysInMonth;
        const driverAttendance = attendance.filter(a => {
            if (a.driverId !== driverId) return false;
            if (!a.date) return false;
            const d = new Date(a.date);
            return d.getMonth() === month && d.getFullYear() === year;
        });
        const presentDays = driverAttendance.filter(a => a.status === 'Present').length;
        const absentDays = driverAttendance.filter(a => a.status === 'Absent').length;
        const leaveDays = driverAttendance.filter(a => a.status === 'Leave').length;
        const incentiveData = calculateDriverIncentives(driverId, month, year);
        const tripIncentive = incentiveData.totalIncentive;
        const sundayCount = incentiveData.sundayCount;
        const sundayExtra = sundayCount * perDaySalary;
        const salaryForPresent = presentDays * perDaySalary;
        const totalEarnings = salaryForPresent + tripIncentive + sundayExtra;
        return {
            basicSalary, perDaySalary, presentDays, absentDays, leaveDays,
            tripIncentive, sundayCount, sundayExtra, totalEarnings,
            daysInMonth, incentiveBreakdown: incentiveData.weeklyBreakdown,
            totalTrips: incentiveData.totalTrips
        };
    }

    async function loadAllData() {
        if (!db) { notify("Waiting for Firebase..."); return; }
        try {
            let snap = await db.collection('vehicles').get();
            vehicles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('drivers').get();
            drivers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('contracts').get();
            if (snap.empty) {
                const defaults = ['Expediter', 'AXP', 'Part-load', 'Others'];
                for (const name of defaults) {
                    const ref = await db.collection('contracts').add({ name });
                    contracts.push({ id: ref.id, name });
                }
            } else contracts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('assignments').get();
            assignments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('supervisors').get();
            supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('mechanics').get();
            mechanics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('fuelRecords').get();
            fuelRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('expenses').get();
            expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('documents').get();
            documents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('maintenance').get();
            maintenance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('trips').get();
            trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('attendance').get();
            attendance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('payroll').get();
            payroll = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('incentives').get();
            incentives = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('auditLogs').get();
            auditLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('leaves').get();
            leaves = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('advances').get();
            advances = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('transfers').get();
            transfers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            snap = await db.collection('breakdowns').get();
            breakdowns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            isDataLoaded = true;
            renderAllPages();
            notify("✅ Data loaded");
        } catch(e) { console.error(e); notify("❌ Firebase: " + e.message); }
    }

    async function saveToFirestore(collectionName, data) {
        if (!db) return null;
        try {
            if (data.id) { await db.collection(collectionName).doc(data.id).set(data); return data.id; }
            else { const ref = await db.collection(collectionName).add(data); data.id = ref.id; return ref.id; }
        } catch(e) { notify("❌ Save error: " + e.message); return null; }
    }

    async function deleteFromFirestore(collectionName, id) {
        if (!db) return;
        try { await db.collection(collectionName).doc(id).delete(); } catch(e) { notify("❌ Delete error: " + e.message); }
    }

        if (!table) return;
        table.innerHTML = `
            <div class="table-container"><table>
                <thead><tr><th>Vehicle</th><th>Expiry</th><th>Status</th><th>Days Left</th></tr></thead>
                <tbody>${vehicles.map(v => {
                    const expiry = v.insuranceExpiry;
                    let status = 'Not Set', daysLeft = '-', cls = 'status-pending';
                    if (expiry) {
                        const diff = Math.ceil((new Date(expiry) - new Date()) / (1000*60*60*24));
                        if (diff < 0) { status = 'Expired'; daysLeft = 'Expired'; cls = 'status-maintenance'; }
                        else if (diff <= 30) { status = 'Expiring Soon'; daysLeft = diff + ' days'; cls = 'status-pending'; }
                        else { status = 'Active'; daysLeft = diff + ' days'; cls = 'status-active'; }
                    }
                    return `<tr><td>${v.reg}</td><td>${expiry || '-'}</td><td><span class="status-badge ${cls}">${status}</span></td><td>${daysLeft}</td></tr>`;
                }).join('')}</tbody>
            </table></div>
        `;
    }

    function loadInsuranceReport() {
        const from = document.getElementById('insuranceFrom')?.value;
        const to = document.getElementById('insuranceTo')?.value;
        const status = document.getElementById('insuranceStatus')?.value;
        let data = vehicles;
        if (status) {
            data = data.filter(v => {
                const expiry = v.insuranceExpiry;
                if (!expiry) return status === 'Not Set';
                const diff = Math.ceil((new Date(expiry) - new Date()) / (1000*60*60*24));
                if (status === 'Active') return diff > 30;
                if (status === 'Expiring Soon') return diff > 0 && diff <= 30;
                if (status === 'Expired') return diff < 0;
                return true;
            });
        }
        reportData.insurance = data;
        renderReportTable('insurance', data, [
            { label: 'Vehicle', value: v => v.reg },
            { label: 'Expiry Date', value: v => v.insuranceExpiry || '-' },
            { label: 'Status', value: v => {
                const expiry = v.insuranceExpiry;
                if (!expiry) return 'Not Set';
                const diff = Math.ceil((new Date(expiry) - new Date()) / (1000*60*60*24));
                return diff < 0 ? 'Expired' : diff <= 30 ? 'Expiring Soon' : 'Active';
            }},
            { label: 'Days Left', value: v => {
                const expiry = v.insuranceExpiry;
                if (!expiry) return '-';
                const diff = Math.ceil((new Date(expiry) - new Date()) / (1000*60*60*24));
                return diff < 0 ? 'Expired' : diff + ' days';
            }}
        ]);
    }

    // ============================================================
    //  RENDER REPORT TABLE HELPER
    // ============================================================
    function renderReportTable(tab, data, columns, summary) {
        const table = document.getElementById(`${tab}ReportTable`);
        if (!table) return;
        let summaryHtml = '';
        if (summary) {
            summaryHtml = `<div class="report-summary">`;
            Object.entries(summary).forEach(([key, value]) => {
                summaryHtml += `<div class="report-summary-item">${key.charAt(0).toUpperCase() + key.slice(1)}: <span>${value}</span></div>`;
            });
            summaryHtml += `</div>`;
        }
        table.innerHTML = `
            ${summaryHtml}
            <div class="table-count">Showing ${data.length} records</div>
            <div class="table-container"><table>
                <thead><tr>${columns.map(c => `<th>${c.label}</th>`).join('')}</tr></thead>
                <tbody>${data.map(d => `<tr>${columns.map(c => `<td>${c.value(d)}</td>`).join('')}</tr>`).join('')}</tbody>
            </table></div>
        `;
    }

    function exportToExcel(data, columns, filename, sheetName) {
        if (!data || data.length === 0) { 
            notify("⚠️ No data to export"); 
            return; 
        }
        const wsData = data.map(item => {
            const row = {};
            columns.forEach(col => {
                row[col.label] = col.value(item);
            });
            return row;
        });
        const ws = XLSX.utils.json_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
        XLSX.writeFile(wb, filename + '.xlsx');
        notify('✅ ' + filename + ' exported successfully!');
    }

    function exportToPDF(elementId, filename) {
        const el = document.getElementById(elementId);
        if (!el || el.innerHTML.trim() === '' || el.innerHTML.includes('No records')) {
            notify("⚠️ No data to export");
            return;
        }
        html2pdf().from(el).set({ 
            margin: 0.5, 
            filename: filename + '.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
        }).save();
        notify('✅ ' + filename + ' PDF exported!');
    }

        await saveToFirestore('maintenance', m);
        renderAllPages();
        notify(`✅ Status updated to ${newStatus}`);
    };

    window.markVehicleReady = async (maintenanceId) => {
        const m = maintenance.find(m => m.id === maintenanceId);
        if (!m) return notify("Not found");
        const isAssignedMechanic = isMechanic() && m.mechanicId === currentUser?.uid;
        if (!canEdit() && !isAssignedMechanic) return notify("Only assigned mechanic can mark ready");
        m.status = 'Ready';
        m.readyAt = new Date().toISOString();
        await saveToFirestore('maintenance', m);
        const vehicle = vehicles.find(v => v.id === m.vehicleId);
        if (vehicle) { vehicle.status = 'Active'; await saveToFirestore('vehicles', vehicle); }
        renderAllPages();
        notify(`✅ Vehicle ready!`);
    };

    window.deleteMaintenance = async (id) => {
        if (!canEdit()) return notify("Only admin can delete");
        if (!confirm("Delete?")) return;
        await deleteFromFirestore('maintenance', id);
        maintenance = maintenance.filter(m => m.id !== id);
        renderAllPages();
        notify("✅ Deleted");
    };

    // Supervisor & Mechanic CRUD
    window.createSupervisor = async () => {
        const email = document.getElementById('supEmail')?.value.trim();
        const name = document.getElementById('supName')?.value.trim();
        const password = document.getElementById('supPassword')?.value;
        const perms = Array.from(document.getElementById('supPermissions')?.selectedOptions || []).map(o => o.value);
        if (!email || !name || !password) { notify("Fill all fields"); return; }
        try {
            const userCred = await auth.createUserWithEmailAndPassword(email, password);
            const data = { email, name, contractId: document.getElementById('supContractId')?.value, permissions: perms, uid: userCred.user.uid };
            const id = await saveToFirestore('supervisors', data);
            if (id) { supervisors.push({ id, ...data }); renderAllPages(); notify(`✅ Supervisor created!`); }
        } catch(e) { notify("Error: " + e.message); }
    };

    window.deleteSupervisor = async (id) => {
        if (!confirm("Delete?")) return;
        await deleteFromFirestore('supervisors', id);
        supervisors = supervisors.filter(s => s.id !== id);
        renderAllPages();
        notify("✅ Deleted");
    };

    window.resetSupervisorPassword = async (email) => {
        try { await auth.sendPasswordResetEmail(email); notify(`✅ Reset email sent to ${email}`); } catch(e) { notify("Error: " + e.message); }
    };

    window.generateRandomPassword = () => {
        const pass = Math.random().toString(36).slice(-8) + "A1!";
        document.getElementById('supPassword').value = pass;
        notify("✅ Password generated");
    };

    window.createMechanic = async () => {
        const email = document.getElementById('mechEmail')?.value.trim();
        const name = document.getElementById('mechName')?.value.trim();
        const password = document.getElementById('mechPassword')?.value;
        if (!email || !name || !password) { notify("Fill all fields"); return; }
        try {
            const userCred = await auth.createUserWithEmailAndPassword(email, password);
            const data = { email, name, specialization: document.getElementById('mechSpecialization')?.value || '', uid: userCred.user.uid, role: 'mechanic' };
            const id = await saveToFirestore('mechanics', data);
            if (id) { mechanics.push({ id, ...data }); renderAllPages(); notify(`✅ Mechanic created!`); }
        } catch(e) { notify("Error: " + e.message); }
    };

    window.deleteMechanic = async (id) => {
        if (!confirm("Delete?")) return;
        await deleteFromFirestore('mechanics', id);
        mechanics = mechanics.filter(m => m.id !== id);
        renderAllPages();
        notify("✅ Deleted");
    };

    window.generateMechanicPassword = () => {
        const pass = Math.random().toString(36).slice(-8) + "A1!";
        document.getElementById('mechPassword').value = pass;
        notify("✅ Password generated");
    };

    window.addContract = async () => {
        const name = document.getElementById('newContractName')?.value;
        if (!name) return notify("Enter contract name");
        const data = {
            name,
            type: document.getElementById('newContractType')?.value || 'Others',
            client: document.getElementById('newContractClient')?.value || '',
            status: document.getElementById('newContractStatus')?.value || 'Active'
        };
        const id = await saveToFirestore('contracts', data);
        if (id) { contracts.push({ id, ...data }); renderAllPages(); notify("✅ Contract added"); }
    };

    window.deleteContract = async (id) => {
        if (!confirm("Delete?")) return;
        await deleteFromFirestore('contracts', id);
        contracts = contracts.filter(c => c.id !== id);
        renderAllPages();
        notify("✅ Deleted");
    };

    // ============================================================
    //  SWITCH REPORT TAB
    // ============================================================
    window.switchReportTab = (tab) => {
        document.querySelectorAll('.report-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.report-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`${tab}ReportPanel`).classList.add('active');
        if (event && event.target) event.target.classList.add('active');
    };

    // ============================================================
    //  SHOW PAGE
    // ============================================================
    window.showPage = (pageId) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId)?.classList.add('active');
        // Refresh data for certain pages
        const refreshMap = {
            'vehiclesPage': renderVehiclesList,
            'driversPage': renderDriversList,
            'assignmentsPage': renderTripsList,
            'maintenancePage': renderMaintenanceList,
            'fuelPage': loadFuelRecords,
            'expensesPage': loadExpensesRecords,
            'insurancePage': loadInsuranceStatus,
            'documentsPage': loadDocumentsList,
            'attendancePage': loadAttendanceRecords,
            'payrollPage': loadPayrollRecords,
            'incentivesPage': loadIncentivesList,
            'leavesPage': renderLeavesList,
            'advancesPage': renderAdvancesList,
            'transfersPage': renderTransfersList,
            'breakdownsPage': renderBreakdownsList,
            'reportsPage': () => {
                ['vehicles','drivers','trips','fuel','expenses','attendance','payroll','incentives','maintenance','insurance'].forEach(tab => {
                    window[`load${tab.charAt(0).toUpperCase() + tab.slice(1)}Report`]();
                });
            }
        };
        if (refreshMap[pageId]) refreshMap[pageId]();
    };

    window.toggleTheme = () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    };

    // ============================================================
    //  AUTH
    // ============================================================
    async function handleLogin(email, password) {
        try {
            const userCred = await auth.signInWithEmailAndPassword(email, password);
            const user = userCred.user;
            if (email === 'harishspeedel@gmail.com') {
                currentUser = user; userRole = 'superadmin'; userPermissions = Object.keys(MODULES);
                await loadAllData();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUserName').innerText = 'Super Admin';
                showPage('dashboardPage');
                notify("✅ Welcome Super Admin!");
                return true;
            }
            if (!isDataLoaded) {
                const snap = await db.collection('supervisors').get();
                supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const snap2 = await db.collection('mechanics').get();
                mechanics = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
                isDataLoaded = true;
            }
            const sup = supervisors.find(s => s.email === email);
            if (sup) {
                currentUser = user; userRole = 'supervisor'; userPermissions = sup.permissions || [];
                userData = sup;
                await loadAllData();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUserName').innerText = sup.name || email.split('@')[0];
                showPage('dashboardPage');
                notify(`✅ Welcome Supervisor ${sup.name || ''}!`);
                return true;
            }
            const mech = mechanics.find(m => m.email === email);
            if (mech) {
                currentUser = user; userRole = 'mechanic'; userPermissions = ['maintenance', 'dashboard'];
                userData = mech;
                await loadAllData();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUserName').innerText = mech.name || 'Mechanic';
                showPage('maintenancePage');
                notify(`✅ Welcome Mechanic ${mech.name || ''}!`);
                return true;
            }
            await auth.signOut();
            document.getElementById('loginError').innerText = '❌ Account not authorized.';
            return false;
        } catch(error) {
            let msg = "Invalid credentials";
            if (error.code === 'auth/user-not-found') msg = "❌ User not found";
            else if (error.code === 'auth/wrong-password') msg = "❌ Incorrect password";
            document.getElementById('loginError').innerText = msg;
            return false;
        }
    }

    function handleLogout() {
        auth.signOut();
        currentUser = null; userRole = null; userPermissions = []; isDataLoaded = false;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
        notify("👋 Logged out");
    }

    async function setupFirstAdmin() {
        try { await auth.createUserWithEmailAndPassword('harishspeedel@gmail.com', 'SPDL@8055'); } catch(e) {}
    }

    // ============================================================
    //  INITIALIZATION
    // ============================================================
    showLoading("Connecting to Firebase...");
    initFirebase();

    function initApp() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') document.body.classList.add('dark');

        const loginHtml = `
            <div class="login-container" id="loginScreen">
                <div class="login-card">
                    <h1>⚡ SPEEDEL EXPRESS</h1>
                    <p>Fleet Management - Enterprise Edition</p>
                    <input type="email" id="loginEmail" placeholder="Email">
                    <input type="password" id="loginPassword" placeholder="Password">
                    <div id="loginError" class="error-message"></div>
                    <button id="loginBtn">Login</button>
                    <p style="margin-top:15px;font-size:0.7rem;color:var(--gray)"><i class="fas fa-cloud"></i> Access from anywhere</p>
                </div>
            </div>
        `;

        const appHtml = `
            <div id="appContainer" style="display:none">
                <div class="firebase-status"><i class="fas fa-cloud-upload-alt"></i> Cloud Sync</div>
                <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <div class="logo-preview" id="logoContainer"><i class="fas fa-truck"></i></div>
                        <h2>SPEEDEL EXPRESS</h2>
                    </div>
                    <div class="nav-links" id="navLinksContainer"></div>
                    <div class="sidebar-footer">
                        <div class="user-info"><i class="fas fa-user-circle"></i><span id="currentUserName"></span></div>
                        <button class="logout-btn" onclick="handleLogout()">Logout</button>
                    </div>
                </div>
                <div class="main-content">
                    <div id="dashboardPage" class="page"><div id="dashboardContent"></div></div>
                    <div id="vehiclesPage" class="page"><div id="vehiclesContent"></div></div>
                    <div id="driversPage" class="page"><div id="driversContent"></div></div>
                    <div id="assignmentsPage" class="page"><div id="assignmentsContent"></div></div>
                    <div id="maintenancePage" class="page"><div id="maintenanceContent"></div></div>
                    <div id="fuelPage" class="page"><div id="fuelContent"></div></div>
                    <div id="expensesPage" class="page"><div id="expensesContent"></div></div>
                    <div id="insurancePage" class="page"><div id="insuranceContent"></div></div>
                    <div id="documentsPage" class="page"><div id="documentsContent"></div></div>
                    <div id="attendancePage" class="page"><div id="attendanceContent"></div></div>
                    <div id="payrollPage" class="page"><div id="payrollContent"></div></div>
                    <div id="incentivesPage" class="page"><div id="incentivesContent"></div></div>
                    <div id="contractsPage" class="page"><div id="contractsContent"></div></div>
                    <div id="supervisorsPage" class="page"><div id="supervisorsContent"></div></div>
                    <div id="mechanicsPage" class="page"><div id="mechanicsContent"></div></div>
                    <div id="reportsPage" class="page"><div id="reportsContent"></div></div>
                    <div id="auditPage" class="page"><div id="auditContent"></div></div>
                    <div id="leavesPage" class="page"><div id="leavesContent"></div></div>
                    <div id="advancesPage" class="page"><div id="advancesContent"></div></div>
                    <div id="transfersPage" class="page"><div id="transfersContent"></div></div>
                    <div id="breakdownsPage" class="page"><div id="breakdownsContent"></div></div>
                </div>
                <div class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
            </div>
        `;

        document.getElementById('appRoot').innerHTML = loginHtml + appHtml;

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value;
            const pwd = document.getElementById('loginPassword').value;
            await handleLogin(email, pwd);
        };

        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        showPage('dashboardPage');
        setTimeout(setupFirstAdmin, 2000);

        auth.onAuthStateChanged(async (user) => {
            if (user && !currentUser) {
                const email = user.email;
                if (email === 'harishspeedel@gmail.com') {
                    currentUser = user; userRole = 'superadmin'; userPermissions = Object.keys(MODULES);
                    await loadAllData();
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                    document.getElementById('currentUserName').innerText = 'Super Admin';
                    showPage('dashboardPage');
                } else {
                    const snap = await db.collection('supervisors').get();
                    supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const snap2 = await db.collection('mechanics').get();
                    mechanics = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
                    const sup = supervisors.find(s => s.email === email);
                    if (sup) {
                        currentUser = user; userRole = 'supervisor'; userPermissions = sup.permissions || [];
                        userData = sup;
                        await loadAllData();
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('appContainer').style.display = 'flex';
                        document.getElementById('currentUserName').innerText = sup.name || email.split('@')[0];
                        showPage('dashboardPage');
                    } else {
                        const mech = mechanics.find(m => m.email === email);
                        if (mech) {
                            currentUser = user; userRole = 'mechanic'; userPermissions = ['maintenance', 'dashboard'];
                            userData = mech;
                            await loadAllData();
                            document.getElementById('loginScreen').style.display = 'none';
                            document.getElementById('appContainer').style.display = 'flex';
                            document.getElementById('currentUserName').innerText = mech.name || 'Mechanic';
                            showPage('maintenancePage');
                        }
                    }
                }
            }
        });
    }

    // Wait for Firebase to be ready
    if (window.firebaseReady) {
        setTimeout(initApp, 500);
    } else {
        document.addEventListener('firebaseReady', () => {
            setTimeout(initApp, 500);
        });
        setTimeout(() => {
            if (!window.firebaseReady) {
                showLoadingError("Firebase connection timeout. Please refresh.");
            }
        }, 10000);
    }
</script>
</body>
</html>
