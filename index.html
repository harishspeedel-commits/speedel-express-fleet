<body>
<div id="appRoot"></div>

<script>
    // ============================================================
    //  GLOBALS
    // ============================================================
    let currentUser = null;
    let userRole = null;
    let userData = null;
    let userPermissions = [];
    let vehicles = [];
    let drivers = [];
    let contracts = [];
    let supervisors = [];
    let mechanics = [];
    let assignments = [];
    let fuelRecords = [];
    let expenses = [];
    let documents = [];
    let maintenance = [];
    let trips = [];
    let attendance = [];
    let payroll = [];
    let incentives = [];
    let auditLogs = [];
    let companyLogo = localStorage.getItem('companyLogo') || '';
    let isDataLoaded = false;

    const INCENTIVE_CONFIG = {
        baseTrips: 6,
        bonusPerTrip: 500,
        sundayExtraSalary: true
    };

    const MODULES = {
        dashboard: { label: 'Dashboard', icon: 'fa-tachometer-alt' },
        vehicles: { label: 'Vehicles', icon: 'fa-truck' },
        drivers: { label: 'Drivers', icon: 'fa-id-card' },
        assignments: { label: 'Trips', icon: 'fa-calendar-check' },
        maintenance: { label: 'Maintenance', icon: 'fa-wrench' },
        fuel: { label: 'Fuel', icon: 'fa-gas-pump' },
        expenses: { label: 'Expenses', icon: 'fa-money-bill-wave' },
        insurance: { label: 'Insurance', icon: 'fa-file-contract' },
        documents: { label: 'Documents', icon: 'fa-folder-open' },
        contracts: { label: 'Contracts', icon: 'fa-file-signature' },
        supervisors: { label: 'Supervisors', icon: 'fa-users-cog' },
        mechanics: { label: 'Mechanics', icon: 'fa-tools' },
        reports: { label: 'Reports', icon: 'fa-chart-line' },
        attendance: { label: 'Attendance', icon: 'fa-clock' },
        payroll: { label: 'Payroll', icon: 'fa-wallet' },
        incentives: { label: 'Incentives', icon: 'fa-star' },
        audit: { label: 'Audit Logs', icon: 'fa-history' }
    };

    function notify(msg) { 
        const toast = document.createElement('div'); 
        toast.className = 'toast-msg'; 
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`; 
        document.body.appendChild(toast); 
        setTimeout(() => toast.remove(), 4000); 
    }

    function toggleSidebar() { 
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebar) { sidebar.classList.toggle('open'); }
        if (overlay) { overlay.classList.toggle('active'); }
    }

    function closeSidebar() { 
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebar) { sidebar.classList.remove('open'); }
        if (overlay) { overlay.classList.remove('active'); }
    }

    function hasPermission(module) { 
        return userPermissions.includes(module) || userRole === 'superadmin' || userRole === 'admin'; 
    }

    function canEdit() { 
        return userRole === 'superadmin' || userRole === 'admin'; 
    }

    function isMechanic() {
        return userRole === 'mechanic';
    }

    function getAvailableVehicles() {
        return vehicles.filter(v => v.status === 'Active');
    }

    // ============================================================
    //  INCENTIVE CALCULATION ENGINE
    // ============================================================
    function calculateDriverIncentives(driverId, month, year) {
        const driverTrips = assignments.filter(a => {
            if (a.driverId !== driverId) return false;
            if (!a.date) return false;
            const d = new Date(a.date);
            return d.getMonth() === month && d.getFullYear() === year && a.status === 'Closed';
        });

        const weeks = {};
        driverTrips.forEach(trip => {
            const date = new Date(trip.date);
            const dayOfWeek = date.getDay();
            const monday = new Date(date);
            monday.setDate(date.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            const weekKey = monday.toISOString().split('T')[0];
            if (!weeks[weekKey]) {
                weeks[weekKey] = { trips: [], sundayTrips: [] };
            }
            if (dayOfWeek === 0) {
                weeks[weekKey].sundayTrips.push(trip);
            } else {
                weeks[weekKey].trips.push(trip);
            }
        });

        let totalIncentive = 0;
        let sundayCount = 0;
        let weeklyBreakdown = [];

        Object.keys(weeks).forEach(weekKey => {
            const week = weeks[weekKey];
            const monToSatTrips = week.trips.length;
            const sundayTrips = week.sundayTrips.length;
            
            let weekIncentive = 0;
            if (monToSatTrips > INCENTIVE_CONFIG.baseTrips) {
                const extraTrips = monToSatTrips - INCENTIVE_CONFIG.baseTrips;
                weekIncentive = extraTrips * INCENTIVE_CONFIG.bonusPerTrip;
            }
            
            if (sundayTrips > 0) {
                sundayCount += sundayTrips;
            }

            totalIncentive += weekIncentive;
            weeklyBreakdown.push({
                week: weekKey,
                monToSatTrips: monToSatTrips,
                sundayTrips: sundayTrips,
                incentive: weekIncentive
            });
        });

        return {
            totalIncentive: totalIncentive,
            sundayCount: sundayCount,
            weeklyBreakdown: weeklyBreakdown,
            totalTrips: driverTrips.length
        };
    }

    function getDaysInMonth(month, year) {
        return new Date(year, month + 1, 0).getDate();
    }

    function calculateSalary(driverId, month, year, basicSalary) {
        const daysInMonth = getDaysInMonth(month, year);
        const perDaySalary = basicSalary / daysInMonth;
        
        const driverAttendance = attendance.filter(a => {
            if (a.driverId !== driverId) return false;
            if (!a.date) return false;
            const d = new Date(a.date);
            return d.getMonth() === month && d.getFullYear() === year;
        });

        const presentDays = driverAttendance.filter(a => a.status === 'Present').length;
        const absentDays = driverAttendance.filter(a => a.status === 'Absent').length;
        const leaveDays = driverAttendance.filter(a => a.status === 'Leave').length;
        
        const incentiveData = calculateDriverIncentives(driverId, month, year);
        const tripIncentive = incentiveData.totalIncentive;
        const sundayCount = incentiveData.sundayCount;
        const sundayExtra = sundayCount * perDaySalary;
        const salaryForPresent = presentDays * perDaySalary;
        const totalEarnings = salaryForPresent + tripIncentive + sundayExtra;
        
        return {
            basicSalary: basicSalary,
            perDaySalary: perDaySalary,
            presentDays: presentDays,
            absentDays: absentDays,
            leaveDays: leaveDays,
            tripIncentive: tripIncentive,
            sundayCount: sundayCount,
            sundayExtra: sundayExtra,
            totalEarnings: totalEarnings,
            daysInMonth: daysInMonth,
            incentiveBreakdown: incentiveData.weeklyBreakdown,
            totalTrips: incentiveData.totalTrips
        };
    }

    // ============================================================
    //  FIREBASE OPERATIONS
    // ============================================================
    async function loadAllData() {
        if (!window.db) { 
            notify("Waiting for Firebase..."); 
            return; 
        }
        try {
            let snap = await getDocs(collection(db, 'vehicles'));
            vehicles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'drivers'));
            drivers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'contracts'));
            if (snap.empty) {
                const defaults = ['Expediter', 'AXP', 'Part-load', 'Others'];
                for (const name of defaults) {
                    const ref = await addDoc(collection(db, 'contracts'), { name });
                    contracts.push({ id: ref.id, name });
                }
            } else {
                contracts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }
            
            snap = await getDocs(collection(db, 'assignments'));
            assignments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'supervisors'));
            supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'mechanics'));
            mechanics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'fuelRecords'));
            fuelRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'expenses'));
            expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'documents'));
            documents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'maintenance'));
            maintenance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'trips'));
            trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'attendance'));
            attendance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'payroll'));
            payroll = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'incentives'));
            incentives = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap = await getDocs(collection(db, 'auditLogs'));
            auditLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            isDataLoaded = true;
            renderAllPages();
            notify("✅ Data loaded from Firebase Cloud");
        } catch(e) { 
            console.error(e); 
            notify("❌ Firebase: " + e.message); 
        }
    }

    async function saveToFirestore(collectionName, data) {
        if (!window.db) return null;
        try {
            if (data.id) { 
                await setDoc(doc(db, collectionName, data.id), data); 
                return data.id; 
            } else { 
                const ref = await addDoc(collection(db, collectionName), data); 
                data.id = ref.id; 
                return ref.id; 
            }
        } catch(e) { 
            notify("❌ Save error: " + e.message); 
            return null; 
        }
    }

    async function deleteFromFirestore(collectionName, id) {
        if (!window.db) return;
        try { 
            await deleteDoc(doc(db, collectionName, id)); 
        } catch(e) { 
            notify("❌ Delete error: " + e.message); 
        }
    }

    // ============================================================
    //  NAVIGATION & RBAC
    // ============================================================
    function buildNavigation() {
        const isAdmin = canEdit();
        const isMech = isMechanic();
        
        let navItems = [
            { id: 'dashboardPage', label: 'Dashboard', icon: 'fa-tachometer-alt', perm: 'dashboard' }
        ];

    function loadMaintenanceJobs() {
        const statusFilter = document.getElementById('maintFilterStatus')?.value || 'all';
        let data = maintenance;
        if (statusFilter !== 'all') {
            data = data.filter(m => m.status === statusFilter);
        }
        
        // Sort by date (newest first)
        data.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
        
        const table = document.getElementById('maintenanceJobsTable');
        if (!table) return;
        
        const isAdmin = canEdit();
        const isMech = isMechanic();
        const mechanicUid = currentUser?.uid;
        
        console.log("Mechanic UID:", mechanicUid);
        console.log("All maintenance jobs:", data);
        
        table.innerHTML = `
            <div class="table-count">Showing ${data.length} maintenance jobs</div>
            <div class="table-container"><table>
                <thead><tr>
                    <th>Vehicle</th>
                    <th>Issue</th>
                    <th>Mechanic</th>
                    <th>Status</th>
                    <th>Timeline</th>
                    <th>Actions</th>
                </tr></thead>
                <tbody>${data.map(m => {
                    const vehicle = vehicles.find(v => v.id === m.vehicleId);
                    const mechanic = mechanics.find(mech => mech.uid === m.mechanicId);
                    // Check if this job is assigned to the current mechanic
                    const isAssignedToMe = isMech && m.mechanicId === mechanicUid;
                    
                    console.log(`Job ${m.id}: mechanicId=${m.mechanicId}, currentUid=${mechanicUid}, isAssigned=${isAssignedToMe}`);
                    
                    let actionButtons = '';
                    
                    // MECHANIC WORKFLOW: Start → Complete → Ready (only for assigned jobs)
                    if (isAssignedToMe || isAdmin) {
                        if (m.status === 'Assigned') {
                            actionButtons += `<button onclick="updateMaintenanceStatus('${m.id}', 'In Progress')" class="action-btn btn-start"><i class="fas fa-play"></i> Start</button>`;
                        }
                        if (m.status === 'In Progress') {
                            actionButtons += `<button onclick="updateMaintenanceStatus('${m.id}', 'Completed')" class="action-btn btn-complete"><i class="fas fa-check"></i> Complete</button>`;
                        }
                        if (m.status === 'Completed') {
                            actionButtons += `<button onclick="markVehicleReady('${m.id}')" class="action-btn btn-ready"><i class="fas fa-check-circle"></i> Ready</button>`;
                        }
                    }
                    
                    // Admin/Supervisor can assign if pending
                    if ((isAdmin || userRole === 'supervisor') && m.status === 'Pending') {
                        actionButtons += `<button onclick="updateMaintenanceStatus('${m.id}', 'Assigned')" class="action-btn btn-assign"><i class="fas fa-user-cog"></i> Assign</button>`;
                    }
                    
                    // Only admin can delete
                    if (isAdmin) {
                        actionButtons += `<button onclick="deleteMaintenance('${m.id}')" class="action-btn btn-delete"><i class="fas fa-trash"></i></button>`;
                    }
                    
                    if (!actionButtons) {
                        actionButtons = '<span style="color:var(--gray);font-size:0.7rem;">No action</span>';
                    }
                    
                    const statusClass = m.status === 'Ready' ? 'status-ready' : 
                                      m.status === 'Completed' ? 'status-completed' :
                                      m.status === 'In Progress' ? 'status-inprogress' :
                                      m.status === 'Assigned' ? 'status-assigned' : 'status-pending';
                    
                    // Timeline display
                    const steps = ['Pending', 'Assigned', 'In Progress', 'Completed', 'Ready'];
                    const currentStep = steps.indexOf(m.status);
                    
                    let timelineHtml = `<div class="status-timeline">`;
                    steps.forEach((step, index) => {
                        const isActive = index <= currentStep;
                        const isCurrent = index === currentStep;
                        timelineHtml += `<span class="step ${isActive ? 'done' : ''}" style="${isCurrent ? 'background:var(--primary);' : ''}">${step}</span>`;
                        if (index < steps.length - 1) {
                            timelineHtml += `<span class="arrow">→</span>`;
                        }
                    });
                    timelineHtml += `</div>`;
                    
                    const isMyJob = isAssignedToMe ? '⭐' : '';
                    const rowClass = isAssignedToMe ? 'mechanic-assigned' : '';
                    
                    return `<tr class="${rowClass}">
                        <td><strong>${vehicle?.reg || 'Vehicle Deleted'}</strong></td>
                        <td>${m.description || '-'}</td>
                        <td>${mechanic?.name || 'Unassigned'} ${isMyJob}</td>
                        <td><span class="status-badge ${statusClass}">${m.status || 'Pending'}</span></td>
                        <td>${timelineHtml}</td>
                        <td>${actionButtons}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table></div>
        `;
    }

    // ============================================================
    //  MAINTENANCE CRUD OPERATIONS
    // ============================================================
    window.createMaintenanceRequest = async () => {
        const vehicleId = document.getElementById('maintVehicleId')?.value;
        const description = document.getElementById('maintDesc')?.value;
        const mechanicUid = document.getElementById('maintMechanicId')?.value;
        
        if (!vehicleId || !description) {
            notify("⚠️ Please fill vehicle and description");
            return;
        }
        
        // Get the mechanic's UID (this is the Firebase Auth UID)
        const data = {
            vehicleId: vehicleId,
            description: description,
            mechanicId: mechanicUid || '',
            status: mechanicUid ? 'Assigned' : 'Pending',
            date: new Date().toISOString().split('T')[0],
            createdAt: new Date().toISOString(),
            createdBy: currentUser?.email || 'Unknown',
            updatedAt: new Date().toISOString()
        };
        
        const id = await saveToFirestore('maintenance', data);
        if (id) {
            // Update vehicle status to Maintenance
            const vehicle = vehicles.find(v => v.id === vehicleId);
            if (vehicle) {
                vehicle.status = 'Maintenance';
                await saveToFirestore('vehicles', vehicle);
            }
            maintenance.push({ id, ...data });
            renderAllPages();
            loadMaintenanceJobs();
            notify("✅ Maintenance request created and vehicle marked for maintenance");
        }
    };

    window.updateMaintenanceStatus = async (id, newStatus) => {
        const m = maintenance.find(m => m.id === id);
        if (!m) { notify("❌ Maintenance record not found"); return; }
        
        // Check if mechanic is assigned to this job
        const isAssignedMechanic = isMechanic() && m.mechanicId === currentUser?.uid;
        if (isMechanic() && !isAssignedMechanic && !canEdit()) {
            notify("⚠️ You are not assigned to this job");
            return;
        }
        
        // Validate status flow
        const validTransitions = {
            'Pending': ['Assigned'],
            'Assigned': ['In Progress'],
            'In Progress': ['Completed'],
            'Completed': ['Ready'],
            'Ready': []
        };
        
        if (!validTransitions[m.status]?.includes(newStatus)) {
            notify(`⚠️ Cannot change from "${m.status}" to "${newStatus}"`);
            return;
        }
        
        m.status = newStatus;
        m.updatedAt = new Date().toISOString();
        m.updatedBy = currentUser?.email || 'Unknown';
        
        if (newStatus === 'Completed') {
            m.completedAt = new Date().toISOString();
        }
        if (newStatus === 'Ready') {
            m.readyAt = new Date().toISOString();
            m.readyBy = currentUser?.email || 'Unknown';
        }
        
        await saveToFirestore('maintenance', m);
        renderAllPages();
        loadMaintenanceJobs();
        notify(`✅ Status updated to ${newStatus}`);
    };

    window.markVehicleReady = async (maintenanceId) => {
        const m = maintenance.find(m => m.id === maintenanceId);
        if (!m) { notify("❌ Maintenance record not found"); return; }
        
        // Check if mechanic is assigned to this job
        const isAssignedMechanic = isMechanic() && m.mechanicId === currentUser?.uid;
        if (!canEdit() && !isAssignedMechanic) {
            notify("⚠️ Only the assigned mechanic or admin can mark vehicle as ready");
            return;
        }
        
        // Update maintenance status
        m.status = 'Ready';
        m.readyAt = new Date().toISOString();
        m.readyBy = currentUser?.email || 'Unknown';
        m.updatedAt = new Date().toISOString();
        await saveToFirestore('maintenance', m);
        
        // Update vehicle status to Active
        const vehicle = vehicles.find(v => v.id === m.vehicleId);
        if (vehicle) {
            vehicle.status = 'Active';
            await saveToFirestore('vehicles', vehicle);
        }
        
        renderAllPages();
        loadMaintenanceJobs();
        notify(`✅ Vehicle ${vehicle?.reg || ''} is now ready and available for trips!`);
    };

    window.deleteMaintenance = async (id) => {
        if (!canEdit()) { notify("⚠️ Only admin can delete"); return; }
        if (!confirm("Delete this maintenance record?")) return;
        
        const m = maintenance.find(m => m.id === id);
        if (m) {
            // If vehicle is still in maintenance, revert to Active
            const vehicle = vehicles.find(v => v.id === m.vehicleId);
            if (vehicle && vehicle.status === 'Maintenance') {
                vehicle.status = 'Active';
                await saveToFirestore('vehicles', vehicle);
            }
        }
        
        await deleteFromFirestore('maintenance', id);
        maintenance = maintenance.filter(m => m.id !== id);
        renderAllPages();
        loadMaintenanceJobs();
        notify("✅ Maintenance record deleted");
    };

    window.createMechanic = async () => {
        const email = document.getElementById('mechEmail')?.value.trim();
        const name = document.getElementById('mechName')?.value.trim();
        const password = document.getElementById('mechPassword')?.value;
        const specialization = document.getElementById('mechSpecialization')?.value;
        
        if (!email || !name || !password) {
            notify("⚠️ Please fill all required fields");
            return;
        }
        if (password.length < 6) {
            notify("⚠️ Password must be at least 6 characters");
            return;
        }
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const data = {
                email,
                name,
                specialization: specialization || '',
                uid: userCred.user.uid,
                createdAt: new Date().toISOString(),
                role: 'mechanic'
            };
            const id = await saveToFirestore('mechanics', data);
            if (id) {
                mechanics.push({ id, ...data });
                renderAllPages();
                notify(`✅ Mechanic "${name}" created successfully!\nEmail: ${email}`);
                document.getElementById('mechEmail').value = '';
                document.getElementById('mechName').value = '';
                document.getElementById('mechPassword').value = '';
                document.getElementById('mechSpecialization').value = '';
            }
        } catch(error) {
            let msg = "Failed to create: ";
            if (error.code === 'auth/email-already-in-use') msg = "❌ Email already registered";
            else if (error.code === 'auth/weak-password') msg = "❌ Password too weak";
            else msg += error.message;
            notify(msg);
        }
    };

    window.deleteMechanic = async (id) => {
        if (!confirm("Delete this mechanic?")) return;
        await deleteFromFirestore('mechanics', id);
        mechanics = mechanics.filter(m => m.id !== id);

    window.generateMechanicPassword = () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        let pass = '';
        for (let i = 0; i < 10; i++) {

    window.calculateAndGeneratePayroll = async () => {
        const driverId = document.getElementById('payrollDriverId')?.value;
        const monthStr = document.getElementById('payrollMonth')?.value;
        if (!driverId || !monthStr) { notify("Select driver and month"); return; }
        
        const [year, month] = monthStr.split('-').map(Number);
        const driver = drivers.find(d => d.id === driverId);
        if (!driver) { notify("Driver not found"); return; }
        
        const basicSalary = driver.basicSalary || 15000;
        const result = calculateSalary(driverId, month - 1, year, basicSalary);
        
        const payrollData = {
            driverId: driverId,
            month: monthStr,
            basicSalary: basicSalary,
            daysInMonth: result.daysInMonth,
            presentDays: result.presentDays,
            absentDays: result.absentDays,
            leaveDays: result.leaveDays,
            tripIncentive: result.tripIncentive,
            sundayCount: result.sundayCount,
            sundayExtra: result.sundayExtra,
            totalEarnings: result.totalEarnings,
            totalTrips: result.totalTrips,
            incentiveBreakdown: JSON.stringify(result.incentiveBreakdown),
            generatedAt: new Date().toISOString()
        };
        
        const existing = payroll.find(p => p.driverId === driverId && p.month === monthStr);
        if (existing) {
            if (!confirm("Payroll already exists. Override?")) return;
            payrollData.id = existing.id;
        }
        
        const id = await saveToFirestore('payroll', payrollData);
        if (id) {
            if (!existing) payroll.push({ id, ...payrollData });
            else {
                const idx = payroll.findIndex(p => p.id === id);
                if (idx >= 0) payroll[idx] = { id, ...payrollData };
            }
            renderAllPages();
            loadPayrollRecords();
            notify(`✅ Payroll generated! Total: ₹${result.totalEarnings.toFixed(2)}`);
        }
    };

    window.generatePayrollForAll = async () => {
        const monthStr = document.getElementById('payrollMonth')?.value;
        if (!monthStr) { notify("Select month first"); return; }
        
        const [year, month] = monthStr.split('-').map(Number);
        let count = 0;
        
        for (const driver of drivers) {
            if (driver.status !== 'Active') continue;
            const basicSalary = driver.basicSalary || 15000;
            const result = calculateSalary(driver.id, month - 1, year, basicSalary);
            
            const payrollData = {
                driverId: driver.id,
                month: monthStr,
                basicSalary: basicSalary,
                daysInMonth: result.daysInMonth,
                presentDays: result.presentDays,
                absentDays: result.absentDays,
                leaveDays: result.leaveDays,
                tripIncentive: result.tripIncentive,
                sundayCount: result.sundayCount,
                sundayExtra: result.sundayExtra,
                totalEarnings: result.totalEarnings,
                totalTrips: result.totalTrips,
                incentiveBreakdown: JSON.stringify(result.incentiveBreakdown),
                generatedAt: new Date().toISOString()
            };
            
            const existing = payroll.find(p => p.driverId === driver.id && p.month === monthStr);
            if (existing) payrollData.id = existing.id;
            
            const id = await saveToFirestore('payroll', payrollData);
            if (id) {
                if (!existing) payroll.push({ id, ...payrollData });
                else {
                    const idx = payroll.findIndex(p => p.id === id);
                    if (idx >= 0) payroll[idx] = { id, ...payrollData };
                }
                count++;
            }
        }
        
        renderAllPages();
        loadPayrollRecords();
        notify(`✅ Generated payroll for ${count} drivers for ${monthStr}`);
    };

    async function handleLogin(email, password) {
        try {
            const userCred = await signInWithEmailAndPassword(auth, email, password);
            const user = userCred.user;
            
            if (email === 'harishspeedel@gmail.com') {
                currentUser = user;
                userRole = 'superadmin';
                userPermissions = Object.keys(MODULES);
                userData = { name: 'Super Admin', permissions: userPermissions };
                await loadAllData();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUserName').innerText = 'Super Admin';
                showPage('dashboardPage');
                notify("✅ Welcome Super Admin!");
                return true;
            }
            
            if (!isDataLoaded) {
                let snap = await getDocs(collection(db, 'supervisors'));
                supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                snap = await getDocs(collection(db, 'mechanics'));
                mechanics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                isDataLoaded = true;
            }
            
            const sup = supervisors.find(s => s.email === email);
            if (sup) {
                currentUser = user;
                userRole = 'supervisor';
                userPermissions = sup.permissions || [];
                userData = sup;
                await loadAllData();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUserName').innerText = sup.name || email.split('@')[0];
                showPage('dashboardPage');
                notify(`✅ Welcome Supervisor ${sup.name || ''}!`);
                return true;
            }
            
            const mech = mechanics.find(m => m.email === email);
            if (mech) {
                currentUser = user;
                userRole = 'mechanic';
                userPermissions = ['maintenance', 'dashboard'];
                userData = mech;
                await loadAllData();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUserName').innerText = mech.name || 'Mechanic';
                showPage('maintenancePage');
                notify(`✅ Welcome Mechanic ${mech.name || ''}!`);
                return true;
            }
            
            await signOut(auth);
            document.getElementById('loginError').innerText = '❌ Account not authorized. Please contact admin.';
            return false;
        } catch(error) {
            console.error("Login error:", error);
            let msg = "Invalid credentials";
            if (error.code === 'auth/user-not-found') msg = "❌ User not found";
            else if (error.code === 'auth/wrong-password') msg = "❌ Incorrect password";
            else if (error.code === 'auth/too-many-requests') msg = "❌ Too many attempts";
            document.getElementById('loginError').innerText = msg;
            return false;
        }
    }

                    <div id="insurancePage" class="page"><div id="insuranceContent"></div></div>
                    <div id="documentsPage" class="page"><div id="documentsContent"></div></div>
                    <div id="attendancePage" class="page"><div id="attendanceContent"></div></div>
                    <div id="payrollPage" class="page"><div id="payrollContent"></div></div>
                    <div id="incentivesPage" class="page"><div id="incentivesContent"></div></div>
                    <div id="contractsPage" class="page"><div id="contractsContent"></div></div>
                    <div id="supervisorsPage" class="page"><div id="supervisorsContent"></div></div>
                    <div id="reportsPage" class="page"><div id="reportsContent"></div></div>
                    <div id="auditPage" class="page"><div id="auditContent"></div></div>
                </div>
                <div class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
            </div>
        `;

        document.getElementById('appRoot').innerHTML = loginHtml + appHtml;

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value;
            const pwd = document.getElementById('loginPassword').value;
            await handleLogin(email, pwd);
        };

        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        showPage('dashboardPage');
        setTimeout(setupFirstAdmin, 2000);

        onAuthStateChanged(auth, async (user) => {
            if (user && !currentUser) {
                const email = user.email;
                if (email === 'harishspeedel@gmail.com') {
                    currentUser = user;
                    userRole = 'superadmin';
                    userPermissions = Object.keys(MODULES);
                    userData = { name: 'Super Admin' };
                    await loadAllData();
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                    document.getElementById('currentUserName').innerText = 'Super Admin';
                    showPage('dashboardPage');
                } else {
                    let snap = await getDocs(collection(db, 'supervisors'));
                    supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    snap = await getDocs(collection(db, 'mechanics'));
                    mechanics = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    const sup = supervisors.find(s => s.email === email);
                    if (sup) {
                        currentUser = user;
                        userRole = 'supervisor';
                        userPermissions = sup.permissions || [];
                        userData = sup;
                        await loadAllData();
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('appContainer').style.display = 'flex';
                        document.getElementById('currentUserName').innerText = sup.name || email.split('@')[0];
                        showPage('dashboardPage');
                    } else {
                        const mech = mechanics.find(m => m.email === email);
                        if (mech) {
                            currentUser = user;
                            userRole = 'mechanic';
                            userPermissions = ['maintenance', 'dashboard'];
                            userData = mech;
                            await loadAllData();
                            document.getElementById('loginScreen').style.display = 'none';
                            document.getElementById('appContainer').style.display = 'flex';
                            document.getElementById('currentUserName').innerText = mech.name || 'Mechanic';
                            showPage('maintenancePage');
                        }
                    }
                }
            }
        });
    }

    initApp();
</script>
</body>
</html>
